<!doctype html>
<!--
  The HTML shell Vite serves. React renders the whole app into <div id="root">.
  Vite injects the compiled JS/CSS here at build time.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the layout scale correctly on phones instead of zooming out. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Summit: a focus timer where every focus minute climbs a real mountain." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Summit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
