<!doctype html>
<!--
  The HTML shell Vite serves. React renders the whole app into <div id="root">.
  Vite injects the compiled JS/CSS here at build time.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the layout scale correctly on phones instead of zooming out. -->
    <!-- viewport-fit=cover lets the installed app use the whole screen on
         phones with a notch; the CSS adds safe-area padding to compensate. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Summit: a focus timer where every focus minute climbs a real mountain."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home-screen icon on iPhone/iPad (iOS ignores the manifest's icons). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Colors the browser/OS chrome around the app, e.g. Android's status bar. -->
    <meta name="theme-color" content="#0f766e" />
    <title>Summit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
